server:
  port: 8080
spring:
  application:
    name: rag

  ai:
    model:
      embedding: ollama

    ollama:
      base-url: http://172.26.8.66:11434
      # ==========================
      # LLM / Chat Model
      # ==========================
      chat:
        options:
          model: llama3:latest
          temperature: 0.2
      # ==========================
      # Embedding Model
      # ==========================
      embedding:
        model: mxbai-embed-large
        keep-alive: 5m
        truncate: true
    # ==========================
    # Milvus Vector Database
    # ==========================
    vectorstore:
      milvus:
        client:
          host: 172.26.8.66
          port: 19530
          username: root
          password: milvus

        database-name: default
        collection-name: documents
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

app:
  rag:
    top-k: 5
    similarity-threshold: 0.75