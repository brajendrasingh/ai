services:
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
#      minio:
#        condition: service_started  
    ports:
      - "3000:3000"
    environment:
      # -------------------------
      # Langfuse
      # -------------------------
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-to-a-long-random-secret
      SALT: change-this-to-another-long-random-value
      # ==========================
      # MinIO / S3
      # ==========================
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: a-bucket
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://milvus-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      # -------------------------
      # ClickHouse
      # -------------------------
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # -------------------------
      # Redis
      # -------------------------
      REDIS_CONNECTION_STRING: redis://redis:6379
      # -------------------------
      # Encryption
      # -------------------------
      ENCRYPTION_KEY: 7f3a9c2e81d64b05a9f7c1e3d8b2460c5a1e9f3b7d2c8046e1a5b9c3f7d02841

    networks:
      - ai-network
  # ============================================================
  # Langfuse Worker
  # ============================================================
  langfuse-worker:
    image: langfuse/langfuse-worker:latest
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # -------------------------
      # Langfuse
      # -------------------------
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-to-a-long-random-secret
      SALT: change-this-to-another-long-random-value
      ENCRYPTION_KEY: 7f3a9c2e81d64b05a9f7c1e3d8b2460c5a1e9f3b7d2c8046e1a5b9c3f7d02841
      # -------------------------
      # MinIO / S3
      # -------------------------
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: a-bucket
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://milvus-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      # -------------------------
      # ClickHouse
      # -------------------------
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # -------------------------
      # Redis
      # -------------------------
      REDIS_CONNECTION_STRING: redis://redis:6379
    networks:
      - ai-network

  postgres:
    image: postgres:18.1
    container_name: langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai-network

  redis:
    image: redis:8.10.2-alpine
    container_name: langfuse-redis
    restart: unless-stopped
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-network

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-redis-data:

networks:
  ai-network:
    name: ai-network
    driver: bridge