services:
  etl:
    image: etl:1.0
    build:
      context: ./../
      dockerfile: Dockerfile
    container_name: etl
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      INGESTION_DATA_DIR: /data/ingestionData

    volumes:
      - ./../../../../data-ingestion-processing/ingestionData:/data/ingestionData

    networks:
      - ai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  etl-data:

networks:
  ai-network:
    external: true
    