server:
  servlet:
    context-path: /
  port: 8080
spring:
  application:
    name: etl
  ai:
    ollama:
      base-url: http://172.26.8.66:11434
      #Embedding Model
      embedding:
        model: mxbai-embed-large

    #Milvus Vector Database
    vectorstore:
      milvus:
        client:
          host: 172.26.8.66
          port: 19530
          username: root
          password: milvus

        database-name: default
        collection-name: documents
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

  datasource:
    url: jdbc:h2:mem:portal
    driverClassName: org.h2.Driver
    username: root
    password: root
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  ingestion:
    data-dir: ${INGESTION_DATA_DIR:./../../ingestionData}
